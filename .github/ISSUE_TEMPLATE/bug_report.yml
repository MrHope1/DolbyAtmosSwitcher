name: Bug report
description: Report a reproducible problem with Dolby Atmos Switcher
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please avoid including private account data or unredacted personal information.
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: dolby
    attributes:
      label: Dolby Access version
      description: Enter the version if you can find it.
      placeholder: e.g. 3.x.x
  - type: dropdown
    id: method
    attributes:
      label: How did you trigger the profile switch?
      options:
        - System tray
        - Command line
        - Both
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: Target profile
      options:
        - Game
        - Movie
        - Music
        - Voice
        - Other / not applicable
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error text
      description: Paste only sanitized information from %LOCALAPPDATA%\DolbyAtmosSwitcher.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Additional context
