name: Feature request
description: Suggest an improvement that fits the project
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem would this solve for Dolby Access users?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful version of the change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Mention any workaround you use today.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This request is related to Dolby Access profile switching or the supporting Windows utility.
          required: true
